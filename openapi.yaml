openapi: 3.1.0
info:
  title: LIGHT FORGE API
  version: 1.0.0
paths:
  /api/geometry/resolve:
    post:
      operationId: resolveComposition
      description: Resolve a composition in millimetres. See API_CONTRACTS.md for
        cross-field validation and datum rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Composition"
      responses:
        "200":
          description: Calculated geometry and outstanding inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedComposition"
        "400":
          description: Malformed JSON
          content:
            application/json:
              schema: &a1
                type: object
                required: &a2
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_json
                      - request_too_large
                      - expected_json
                      - invalid_composition
                  issues: &a3
                    type: array
                    items:
                      type: object
                      required:
                        - path
                        - message
                      properties:
                        path:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        message:
                          type: string
        "413":
          description: Request exceeds 1 MiB
          content:
            application/json:
              schema: *a1
        "415":
          description: Content-Type must be application/json
          content:
            application/json:
              schema: *a1
        "422":
          description: Composition failed validation
          content:
            application/json:
              schema: *a1
  /api/rfq/quick:
    post:
      operationId: quickRfq
      description: Render one Quick RFQ snapshot as text or a printable PDF. Send all
        photo originals for a photo-bearing PDF.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum:
              - text
              - pdf
            default: text
        - name: lang
          in: query
          schema:
            type: string
            enum:
              - en
              - zh
              - en-zh
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickRfqRequest"
          multipart/form-data:
            schema:
              type: object
              required:
                - input
              additionalProperties: false
              properties:
                input:
                  type: string
                  description: JSON-encoded QuickRfqRequest
              patternProperties:
                ^photo:[A-Za-z0-9_-]{1,64}$:
                  type: string
                  format: binary
            encoding:
              input:
                contentType: text/plain
      responses:
        "200":
          description: Text response or PDF bytes available for inline display and download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickRfqText"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid options, UTF-8, JSON or multipart body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "403":
          description: Cross-site request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "413":
          description: Request exceeds size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "422":
          description: Invalid snapshot, photo or project/geometry conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "503":
          description: PDF renderer is busy, unavailable or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
  /api/rfq/detailed:
    post:
      operationId: detailedRfq
      description: Render one Detailed RFQ specification package (BOM, provenance
        summary, revision metadata, open engineering checklist) as text or
        printable PDF.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum:
              - text
              - pdf
            default: text
        - name: lang
          in: query
          schema:
            type: string
            enum:
              - en
              - zh
              - en-zh
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetailedRfqRequest"
          multipart/form-data:
            schema:
              type: object
              required:
                - input
              additionalProperties: false
              properties:
                input:
                  type: string
                  description: JSON-encoded DetailedRfqRequest
              patternProperties:
                ^photo:[A-Za-z0-9_-]{1,64}$:
                  type: string
                  format: binary
            encoding:
              input:
                contentType: text/plain
      responses:
        "200":
          description: Text response or PDF bytes available for inline display and download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickRfqText"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid options, UTF-8, JSON or multipart body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "403":
          description: Cross-site request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "413":
          description: Request exceeds size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "422":
          description: Invalid snapshot, photo or project/geometry conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "503":
          description: PDF renderer is busy, unavailable or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
  /api/photo-analysis:
    get:
      operationId: getPhotoAnalysisCapabilities
      responses:
        "200":
          description: Analysis mode and upload limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisCapabilities"
    post:
      operationId: analyzeSelectedPhotos
      description: Analyze selected originals. In metadata_only mode only pixel
        dimensions are returned.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - input
              additionalProperties: false
              properties:
                input:
                  type: string
                  description: JSON-encoded PhotoAnalysisInput
              patternProperties:
                ^photo:[A-Za-z0-9_-]{1,64}$:
                  type: string
                  format: binary
            encoding:
              input:
                contentType: text/plain
      responses:
        "200":
          description: Photo metadata and visual estimates, when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisResponse"
        "400":
          description: Malformed multipart or JSON manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisError"
        "403":
          description: Cross-site request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisError"
        "413":
          description: Request exceeds size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisError"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisError"
        "422":
          description: Invalid photo manifest or original file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisError"
        "502":
          description: Analysis engine failure or invalid output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisError"
        "503":
          description: Local engine is unavailable, busy, or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisError"
  /api/visual-search:
    get:
      operationId: getVisualSearchCapabilities
      responses:
        "200":
          description: Provider availability and local usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualSearchCapabilities"
    post:
      operationId: searchLightingCatalogue
      description: Search the source-backed starter catalogue. Free-project Gemini,
        when enabled and explicitly requested, only suggests visual query terms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualSearchInput"
          multipart/form-data:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  type: string
                  description: JSON VisualSearchInput with one photo metadata item
              patternProperties:
                ^photo:[A-Za-z0-9_-]{1,64}$:
                  type: string
                  format: binary
      responses:
        "200":
          description: Catalogue results, manual web query URLs, and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualSearchResponse"
        "400":
          description: Invalid body
        "403":
          description: Cross-site request rejected
        "413":
          description: Upload too large
        "415":
          description: Unsupported media type
        "422":
          description: Invalid search or photo
  /api/visual-search/local:
    get:
      operationId: getLocalVisualSearchCapabilities
      responses:
        "200":
          description: Availability and indexed reference count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVisualSearchCapabilities"
    post:
      operationId: matchLocalVisualReferences
      description: Compare one JPEG, PNG or WebP image of up to 5 MiB with the
        configured local catalogue.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  type: string
                  description: JSON object with one photo metadata field,
                    {photo:{id,name,type,size}}
              patternProperties:
                ^photo:[A-Za-z0-9_-]{1,64}$:
                  type: string
                  format: binary
      responses:
        "200":
          description: Up to five image matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVisualSearchResponse"
        "400":
          description: Invalid body
        "403":
          description: Cross-site request rejected
        "413":
          description: Upload too large
        "415":
          description: Unsupported media type
        "422":
          description: Invalid photo
        "503":
          description: Local index absent or invalid
  /api/ai/gemini/status:
    get:
      operationId: getGeminiAiStatus
      description: Return server-side Gemini AI configuration status, selected
        Free-Tier Flash model, and last connection test result without exposing
        secrets.
      responses:
        "200":
          description: Gemini AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiStatusResponse"
  /api/ai/gemini/test:
    post:
      operationId: testGeminiAiConnection
      description: Verify GEMINI_API_KEY, list account Flash models, and test live
        structured JSON output.
      responses:
        "200":
          description: Gemini connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiTestResponse"
        "403":
          description: Cross-site request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
  /api/ai/gemini/analyze-photo:
    post:
      operationId: analyzePhotoWithGemini
      description: Analyze one luminaire photograph using Gemini Flash structured JSON
        output. Original image is never overwritten; estimates remain explicitly
        labelled.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Structured luminaire visual analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiPhotoAnalysis"
        "400":
          description: Missing file field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "403":
          description: Cross-site request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "404":
          description: Model unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "422":
          description: Invalid image or blocked paid model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "429":
          description: Quota or daily app limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "502":
          description: Invalid response from Gemini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "503":
          description: API key not configured or network error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
  /api/ai/gemini/analyze-drawing:
    post:
      operationId: analyzeDrawingWithGemini
      description: Read one technical drawing image or PDF specification with Gemini
        Flash, normalizing all extracted lengths to millimetres (mm) with
        Confirmed/Estimated/Unknown provenance.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Structured technical drawing / PDF specification in mm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiDrawingAnalysis"
        "400":
          description: Missing file field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "403":
          description: Cross-site request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "404":
          description: Model unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "422":
          description: Invalid PDF/drawing file or blocked paid model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "429":
          description: Quota or daily app limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "502":
          description: Invalid response from Gemini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
        "503":
          description: API key not configured or network error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiErrorResponse"
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - geometryVersion
                properties:
                  status:
                    const: ok
                  geometryVersion:
                    const: 1
components:
  schemas:
    Composition:
      type: object
      properties:
        schemaVersion:
          type: number
          const: 1
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        name:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        site:
          type: object
          properties:
            ceilingFromFloorMm:
              type: object
              properties:
                value:
                  type: number
                  minimum: 0.001
                  maximum: 1000000
                source:
                  type: string
                  enum:
                    - user
                    - documentation
                    - estimated
              required:
                - value
                - source
              additionalProperties: false
            tabletopFromFloorMm:
              type: object
              properties:
                value:
                  type: number
                  minimum: 0
                  maximum: 1000000
                source:
                  type: string
                  enum:
                    - user
                    - documentation
                    - estimated
              required:
                - value
                - source
              additionalProperties: false
          additionalProperties: false
        elements:
          minItems: 1
          maxItems: 96
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9_-]{1,64}$
              name:
                type: string
                minLength: 1
                maxLength: 120
              productComponentId:
                type: string
                pattern: ^[A-Za-z0-9_-]{1,64}$
              shape:
                oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        const: ring
                      outerDiameterMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      innerDiameterMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      profileHeightMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                    required:
                      - type
                      - outerDiameterMm
                      - innerDiameterMm
                      - profileHeightMm
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        const: arc
                      chordMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      riseMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      radialThicknessMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      depthMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                    required:
                      - type
                      - chordMm
                      - riseMm
                      - radialThicknessMm
                      - depthMm
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        const: linear
                      lengthMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      widthMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      heightMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                    required:
                      - type
                      - lengthMm
                      - widthMm
                      - heightMm
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        const: envelope
                      intendedShape:
                        type: string
                        enum:
                          - ring
                          - arc
                          - linear
                          - custom
                      widthMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      depthMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      heightMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: 0.001
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                    required:
                      - type
                      - intendedShape
                      - widthMm
                      - depthMm
                      - heightMm
                    additionalProperties: false
              position:
                type: object
                properties:
                  xy:
                    type: object
                    properties:
                      x:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: -1000000
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                      y:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: -1000000
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                    additionalProperties: false
                  lowest:
                    type: object
                    properties:
                      datum:
                        type: string
                        enum:
                          - floor
                          - ceiling
                          - tabletop
                      offsetMm:
                        type: object
                        properties:
                          value:
                            type: number
                            minimum: -1000000
                            maximum: 1000000
                          source:
                            type: string
                            enum:
                              - user
                              - documentation
                              - estimated
                        required:
                          - value
                          - source
                        additionalProperties: false
                    required:
                      - datum
                      - offsetMm
                    additionalProperties: false
                  yawDeg:
                    type: object
                    properties:
                      value:
                        type: number
                        minimum: -360
                        maximum: 360
                      source:
                        type: string
                        enum:
                          - user
                          - documentation
                          - estimated
                    required:
                      - value
                      - source
                    additionalProperties: false
                required:
                  - xy
                  - lowest
                additionalProperties: false
              attachments:
                maxItems: 24
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,64}$
                    label:
                      type: string
                      minLength: 1
                      maxLength: 120
                    point:
                      type: object
                      properties:
                        x:
                          type: object
                          properties:
                            value:
                              type: number
                              minimum: -1000000
                              maximum: 1000000
                            source:
                              type: string
                              enum:
                                - user
                                - documentation
                                - estimated
                          required:
                            - value
                            - source
                          additionalProperties: false
                        y:
                          type: object
                          properties:
                            value:
                              type: number
                              minimum: -1000000
                              maximum: 1000000
                            source:
                              type: string
                              enum:
                                - user
                                - documentation
                                - estimated
