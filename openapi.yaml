openapi: 3.1.0
info:
  title: LIGHT FORGE Geometry API
  version: 1.0.0
paths:
  /api/geometry/resolve:
    post:
      operationId: resolveComposition
      description: Resolve a composition in millimetres. See API_CONTRACTS.md for
        cross-field validation and datum rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Composition"
      responses:
        "200":
          description: Calculated geometry and outstanding inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedComposition"
        "400":
          description: Malformed JSON
          content:
            application/json:
              schema: &a1
                type: object
                required: &a2
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_json
                      - request_too_large
                      - expected_json
                      - invalid_composition
                  issues: &a3
                    type: array
                    items:
                      type: object
                      required:
                        - path
                        - message
                      properties:
                        path:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        message:
                          type: string
        "413":
          description: Request exceeds 1 MiB
          content:
            application/json:
              schema: *a1
        "415":
          description: Content-Type must be application/json
          content:
            application/json:
              schema: *a1
        "422":
          description: Composition failed validation
          content:
            application/json:
              schema: *a1
  /api/rfq/quick:
    post:
      operationId: quickRfq
      description: Render one Quick RFQ snapshot as text or a printable PDF. Send all
        photo originals for a photo-bearing PDF.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum:
              - text
              - pdf
            default: text
        - name: lang
          in: query
          schema:
            type: string
            enum:
              - en
              - zh
              - en-zh
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickRfqRequest"
          multipart/form-data:
            schema:
              type: object
              required:
                - input
              additionalProperties: false
              properties:
                input:
                  type: string
                  description: JSON-encoded QuickRfqRequest
              patternProperties:
                ^photo:[A-Za-z0-9_-]{1,64}$:
                  type: string
                  format: binary
            encoding:
              input:
                contentType: text/plain
      responses:
        "200":
          description: Text response or PDF bytes available for inline display and download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickRfqText"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid options, UTF-8, JSON or multipart body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "403":
          description: Cross-site request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "413":
          description: Request exceeds size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "422":
          description: Invalid snapshot, photo or project/geometry conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
        "503":
          description: PDF renderer is busy, unavailable or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqError"
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - geometryVersion
                properties:
                  status:
                    const: ok
                  geometryVersion:
                    const: 1
